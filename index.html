<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Centuries · 19.3 秒动作试验</title>
  <link rel="icon" href="data:,">
  <script>if(new URLSearchParams(location.search).has('export'))document.documentElement.classList.add('export');</script>
  <style>
    @font-face{font-family:Archivo;src:url('./assets/Archivo.ttf') format('truetype');font-weight:100 900;font-display:block}
    :root{color-scheme:dark;--ink:#080e15;--paper:#ede6d8;--muted:#b6b9bb;--line:#57616a;--accent:#ff844b}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--ink);color:var(--paper)}
    body{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;font:14px Archivo,'Microsoft YaHei',sans-serif}
    main{width:min(100%,1440px)}
    #screen{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:var(--ink)}
    #stage{display:block;width:100%;height:100%}
    #loading{position:absolute;inset:0;display:grid;place-content:center;padding:24px;text-align:center;background:var(--ink);color:var(--muted)}
    #loading[hidden]{display:none}
    .controls{display:flex;align-items:center;gap:12px;padding-top:18px}
    button{min-height:44px;min-width:66px;padding:10px 16px;border:1px solid var(--line);background:transparent;color:var(--paper);font:600 14px Archivo,'Microsoft YaHei',sans-serif;cursor:pointer}
    button:hover:not(:disabled){border-color:var(--paper);background:var(--paper);color:var(--ink)}
    button:disabled{opacity:.48;cursor:wait}
    button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
    #play{border-color:var(--paper);min-width:80px}
    #seek{flex:1;min-width:50px;height:44px;margin:0 4px;accent-color:var(--accent);cursor:pointer}
    #seek:disabled{cursor:wait}
    #clock{width:96px;flex-shrink:0;font-variant-numeric:tabular-nums;text-align:right;color:var(--muted);font-size:13px;white-space:nowrap}
    .caption{display:flex;align-items:baseline;justify-content:space-between;gap:24px;margin-top:18px}
    h1{margin:0;font-size:15px;font-weight:600;line-height:1.6}
    .keys{margin:0;color:var(--muted);font-size:12px;line-height:1.8}
    #status{min-height:20px;margin:8px 0 0;color:var(--accent);font-size:13px;line-height:1.6}
    #status:empty{display:none}
    ::selection{background:var(--accent);color:var(--ink)}
    html{scrollbar-color:var(--line) var(--ink)}
    .export body{display:block;padding:0;min-height:0;overflow:hidden}
    .export main{width:100vw}
    .export #screen{width:100vw;height:100vh;aspect-ratio:auto}
    .export .controls,.export .caption,.export #status,.export #loading{display:none}
    @media(max-width:640px){body{padding:12px}.controls{gap:8px;flex-wrap:wrap;padding-top:12px}button{padding:9px 12px;min-width:60px}#play{min-width:68px}#seek{order:5;flex-basis:calc(100% - 108px);margin:0}#clock{order:6}.caption{display:block;margin-top:12px}.keys{margin-top:6px}h1{font-size:14px}}
  </style>
</head>
<body>
  <main>
    <div id="screen">
      <canvas id="stage" aria-label="工业运动试验：从蒸汽汽缸到连续传动"></canvas>
      <div id="loading" role="status">正在载入画面…</div>
    </div>
    <div class="controls" aria-label="播放控制">
      <button id="play" disabled>播放</button>
      <button id="reset" disabled>重播</button>
      <button id="mute" aria-pressed="false" disabled>静音</button>
      <input id="seek" type="range" min="0" max="19.3" step="0.0166666667" value="0" aria-label="播放位置（秒）" disabled>
      <output id="clock" for="seek">0.00 / 19.30</output>
    </div>
    <div class="caption">
      <h1>Centuries · 19.3 秒动作试验</h1>
      <p class="keys">空格 播放 / 暂停 · ← → 逐帧 · Shift + ← → 移动 0.25 秒</p>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script type="module" src="./src/main.js"></script>
  <script type="module" src="./player.js"></script>
</body>
</html>
